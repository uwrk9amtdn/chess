<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Room</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <aside id="sidebar">
    <h1><a href="#/">Game Room</a></h1>
    <p id="me"></p>
    <h2>Players <span id="userCount"></span></h2>
    <ul id="users"></ul>
    <button id="soundToggle"></button>
  </aside>

  <main>
    <section id="home">
      <h2>Games</h2>
      <div id="gameGrid"></div>
    </section>

    <section id="gamePage" hidden>
      <header id="gameHeader">
        <a href="#/" id="backLink">&larr; All games</a>
        <h2 id="gameTitle"></h2>
        <div id="afterGame" hidden>
          <button id="rematch" class="primary">Rematch</button>
          <button id="closeMatch">Close</button>
        </div>
      </header>
      <div id="gameHint">
        <p id="gameDescription"></p>
        <p>Pick an idle player from the list and press Invite to challenge them.</p>
      </div>
      <!-- The game currently being played draws itself in here. -->
      <div id="matchHost"></div>
    </section>
  </main>

  <div id="notices">
    <div id="offline" hidden>Connection lost. Reconnecting…</div>
    <div id="invites"></div>
    <div id="toasts"></div>
  </div>

  <dialog id="nameDialog">
    <form id="nameForm">
      <h2>Choose a user name</h2>
      <input id="nameInput" maxlength="16" autocomplete="off" required>
      <p class="formError" id="nameError"></p>
      <button class="primary">Enter</button>
    </form>
  </dialog>

  <dialog id="inviteDialog">
    <h2 id="inviteTitle"></h2>
    <!-- Filled in by the game being offered. -->
    <div id="inviteForm"></div>
    <button id="inviteCancel">Cancel</button>
  </dialog>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
